aid: squint
name: Squint
description: >-
  Squint is a Manufacturing Intelligence platform that uses AI and augmented
  reality to help industrial and frontline operations teams lower downtime and
  improve quality at scale. Its mobile app captures and digitizes tribal
  knowledge from video and real work, orchestrates workflows and work
  assignments across employees and locations, provides AI-powered
  troubleshooting and expert guidance, and delivers analytics on performance
  across teams and sites. Founded by Devin Bhushan, Squint began in
  manufacturing and serves automotive, food and beverage, oil and gas, heavy
  industrials, equipment, consumer packaged goods, and energy customers,
  expanding into healthcare and hospitality. Backed by Menlo Ventures. As of
  this enrichment pass Squint exposes no public developer API; its documentation
  and application are gated behind a Squint workspace login.
